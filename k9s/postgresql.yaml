apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: POSTGRES_DB
          value: "banking"
        - name: POSTGRES_USER
          value: "banking_user"
        - name: POSTGRES_PASSWORD
          value: "local-dev-password"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - exec pg_isready -U banking_user -d banking
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: banking
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS accounts (
      id SERIAL PRIMARY KEY,
      balance DECIMAL(15,2) NOT NULL DEFAULT 0.00,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    INSERT INTO accounts (id, balance) VALUES 
    (1, 1000.00),
    (2, 2500.50),
    (3, 500.00)
    ON CONFLICT (id) DO NOTHING;
    
    CREATE TABLE IF NOT EXISTS transactions (
      id SERIAL PRIMARY KEY,
      account_id INTEGER REFERENCES accounts(id),
      amount DECIMAL(15,2) NOT NULL,
      type VARCHAR(20) NOT NULL,
      status VARCHAR(20) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: banking
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432