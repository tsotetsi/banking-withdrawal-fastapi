apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:latest
        ports:
        - containerPort: 4566
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        environment:
        - name: SERVICES
          value: sns
        - name: DEBUG
          value: "1"
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: localstack-service
  namespace: banking
spec:
  selector:
    app: localstack
  ports:
  - port: 4566
    targetPort: 4566